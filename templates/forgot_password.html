<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    
  @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

  *{

  font-family: "Merriweather", serif;
  font-optical-sizing: auto;
  font-weight: <weight>;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
  }
    body {
      background-image:linear-gradient(to right,rgba(255,113,0,0.3),rgba(255, 166, 0, 1));
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .forgot-container {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius:25px;
    }

    .forgot-image {
      flex: 1;
      text-align: center;
    }

    .forgot-image img {
      max-width: 80%;
    }

    .forgot-form {
      flex: 1;
      {% comment %} padding-left:90px; {% endcomment %}
    }

    .form-icon {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #555;
    }

    .form-control {
      padding-left: 40px;
    }

    .error-msg {
      color: red;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .btn-orange {
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      color: white;
      border: none;
      width: 62%;
    }
    .btn-orange:hover {
      background: linear-gradient(90deg, #feb47b, #ff7e5f);
    }

    .back-login {
      text-align: center;
      margin-top: 15px;
    }

    .back-login a {
      text-decoration: none;
      color: #000;
    }
    .phone-box{
      padding-left:90px
    }

    .back-login a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class=" card d-flex flex-row forgot-container col-md-4 shadow-lg">
    {% comment %} <!-- Left Image -->
    <div class="forgot-image col-md-6">
      <img src="{% static 'images/lock1.jpg' %}" alt="Forgot password illustration" class="img-lg">
    </div> {% endcomment %}
    
    <!-- Right Form -->
    <div class="forgot-form">
      <h4 class="top-0 text-center mt-3"><strong>Forgot Password</strong></h4>
      {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
    {% endif %}
      
      <form method="POST" action="{% url 'forgot_password' %}" >
        {% csrf_token %}
        <div class="phone-box ">
        <strong><label class="mt-5 mb-1">Enter your phone Number:</label></strong>
        <div class="mb-3  position-relative">
          <span class="form-icon">
            <i class="bi bi-phone-fill"></i>
          </span>
          <input type="text" class="form-control border border-warning w-75" placeholder="Phone Number" name="phone" required>
        </div>
      </div>
        <div class="align-items-center d-flex justify-content-center">
        <!-- Submit Button -->
          <button type="submit" class="btn btn-orange submit-btn ">Submit</button>
        </div>
        <!-- Back to Login -->
        <div class="back-login mt-3 mb-3 ">
          <a href="{% url 'login' %}">
            <i class="bi bi-arrow-left"></i> Back to Login
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap Icons -->
</body>
</html>
