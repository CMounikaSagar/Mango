<!-- templates/accounts/forgot_password_phone.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Phone</title>
</head>
<body>
    <h2>Forgot Password</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label for="phone">Enter your phone number:</label><br>
        <input type="text" name="phone" required placeholder="e.g. 9876543210"><br><br>
        <button type="submit">Send OTP</button>
    </form>
</body>
</html>
