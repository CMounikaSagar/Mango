<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .navbar {
      height: 12vh;
    }

    .search {
      background-image: linear-gradient(rgba(255, 133, 0, 1), rgba(255, 166, 69, 1));
      border-radius: 50px;
    }

    .nav-link {
      position: relative;
      padding: 0.5rem 1rem;
      color: rgba(255, 133, 0, 0.6);
      transition: color 0.3s ease;
    }
    .nav-link:hover{
      color:rgba(255, 133, 0, 1);
      padding-bottom:20px;
    }

    .nav-link.active {
      color: rgba(255, 133, 0, 1); !important
      /* Purple */
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 100%;
      background-color:rgba(255, 133, 0, 1);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }

    .nav-link.active::after {
      transform: scaleX(1);
    }

    .navbar-brand {
      font-weight: bold;
      color:rgba(255, 133, 0, 1) !important;
    }

    .icon-badge {
      position: relative;
    }

    .icon-badge span {
      position: absolute;
      top: -8px;
      right: -10px;
      background-color: red;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-light  shadow-sm ">
    <div class="pt-4">
    <a class="navbar-brand " href="{% url 'home' %}"><img src="{% static 'images/3-removebg-preview.png' %}" style="width:160px" /></a>
    </div>
    <div class="ms-auto d-flex justify-content-between align-items-center gap-4 my-auto mr-4 w-50">
      <div class="w-50 d-flex flex-row justify-content-end ">
        <form action="{% url 'search' %}" class="search" method='GET'>
          <div class="input-group d-flex flex-row justify-content-end">
            <div>
            <input type="text" class="form-control" style="width:100%;" placeholder="Search" name="keyword" autocomplete="off">
            </div>
            <div class="input-group-append">
              <button class="btn btn-warning" type="submit">
                <i class="fa fa-search"></i>
              </button>
            </div>
          </div>
        </form>
      </div>
      {% comment %} <a href="{% url 'home' %}" class="nav-link {% if 'home' in request.path%} active {% endif %}">
        Home</a> {% endcomment %}
      <a href="{% url 'store' %}" class="nav-link {% if 'store' in request.path%} active {% endif %}"> Store</a>
      <a href="{% url 'wishlist' %}" class="nav-link icon-badge {% if '/wishlist/' in request.path%} active {% endif %}">
        <div> <i class="bi bi-heart-fill booticon fs-4"></i>
          <span class="mr-3">{{ wishlist_count }}</span>
        </div></a>
      <a href="{% url 'cart' %}" class="nav-link icon-badge {% if '/cart/' in request.path%} active {% endif %}">
        <div> <i class="bi bi-cart-fill booticon fs-4"></i>
          <span class="mr-3">{{ cart_count }}</span>
        </div>
      </a>
      <a href="{% url 'profile' %}"
        class="nav-link icon-badge {% if '/profile/' in request.path%} active {% endif %}"><i
          class="bi bi-person-fill fs-4"></i> </a>
    </div>
  </nav>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</body>

</html>
