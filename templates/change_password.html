<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/bcf6364679.js" crossorigin="anonymous"></script>

    <style>
        
		@import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

		*{

		font-family: "Merriweather", serif;
		font-optical-sizing: auto;
		font-weight: <weight>;
		font-style: normal;
		font-variation-settings:
			"wdth" 100;
		}

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }
        .success{
          color:green;
        }
        .danger{
          color : red;
        }
    </style>
</head>

<body class="bg-gray-100 ">
    {% include 'nav.html' %}
    <section class="section-conten padding-y bg my-5">

<div class="container">
	<div class="row">
	{% include 'dashboard_aside.html' %}
	<main class="col-md-8">
		<div class=" card d-flex flex-row align-items-center justify-content-center forgot-container">
    <!-- Left Image -->
    
    
    <!-- Right Form -->
    <div class="forgot-form p-5 col-md-8">
      <h4 class="top-0 text-center"><h2>Change Your Password</h2></h4>
      {% if messages %}
        {% for message in messages %}
            <p class="{{ message.tags }}">{{ message }}</p>
        {% endfor %}
        {% endif %}
      
      <form method="POST" action="{% url 'change_password' %}">
        {% csrf_token %}
        <strong><label class="mt-5 mb-1">Current Password:</label></strong>
        <div class="mb-3  position-relative">
          <input type="text" class="form-control border border-warning" placeholder="Current password" name="old_password" required>
        </div>
        <strong><label class="mb-1">New Password:</label></strong>
        <div class="mb-3 position-relative"> 
          <input type="text" class="form-control border border-warning" placeholder="New Password" name="new_password" required>
        </div>
        <strong><label class="mb-1">Confirm New Password:</label></strong>
        <div class="mb-3 position-relative"> 
          <input type="text" class="form-control border border-warning" placeholder="Confirm Password" name="confirm_new_password" required>
        </div>
        <div class="align-items-center d-flex justify-content-center ">
        <!-- Submit Button -->
          <button type="submit" class="btn btn-warning submit-btn w-25">Submit</button>
        </div>
        <!-- Back to Login -->
        
      </form>
    </div>
  </div>
</div> <!-- row.// -->
</div>
</section>    {% include 'footer.html' %}
</body>

</html>
