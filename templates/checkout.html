<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link type="image/x-icon" href="{% static 'images/favicon.ico' %}" rel="shortcut icon">

    <!-- jQuery -->
    <script src="{% static 'js/jquery-2.0.0.min.js' %}" type="text/javascript"></script>

    <!-- Bootstrap4 files-->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}" type="text/javascript"></script>
    <link type="text/css" href="{% static 'css/bootstrap.css' %}" rel="stylesheet">

    <!-- Font awesome 5 -->
    <link type="text/css" href="{% static 'fonts/fontawesome/css/all.min.css' %}" rel="stylesheet">

    <!-- custom style -->
    <link type="text/css" href="{% static 'css/ui.css' %}" rel="stylesheet">
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet" media="only screen and (max-width: 1200px)">

    <!-- custom javascript -->
    <script src="{% static 'js/script.js' %}" type="text/javascript"></script>

    <script type="{% static 'text/javascript'%}"></script>
    <script src="https://kit.fontawesome.com/bcf6364679.js" crossorigin="anonymous"></script>

</head>
<style>
    * {
        font-family: 'Montserrat';
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
</style>

<body class="bg-body-tertiary">
    {% include 'nav.html' %}

    <section class="section-content padding-y bg">
        <div class="container">

            <!-- ============================ COMPONENT 1 ================================= -->


            <div class="row">
                <aside class="col-lg-6">
                    <div class="card">
                        <div class="card-body">
                            <div class="card-title">
                                <h3 class="card-title">Billing Address</h3>
                                <form action="{% url 'place_order' %}" method="POST">
                                    {% csrf_token %}
                                    <div class="form-row">
                                        <div class="col form-group col-md-6">
                                            <label for="first_name">First_name</label>
                                            <input class="form-control" name="first_name" type="text" placeholder="first_name" required>
                                        </div>
                                        <div class="col form-group col-md-6">
                                            <label for="first_name">Last_name</label>
                                            <input class="form-control" name="last_name" type="text" placeholder="last_name" required>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="col form-group">
                                            <label for="first_name">email</label>
                                            <input class="form-control" name="email" type="email" placeholder="email" required>
                                        </div>
                                        <div class="col form-group">
                                            <label for="first_name">Phone_Number</label>
                                            <input class="form-control" name="phone" type="text" placeholder="phone" required>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="col form-group">
                                            <label for="first_name">Address Line 1</label>
                                            <input class="form-control" name="address_line_1" type="textfield" placeholder="address_Line_1" required>
                                        </div>
                                        <div class="col form-group">
                                            <label for="first_name">Address Line 1</label>
                                            <input class="form-control" name="address_line_2" type="textfield" placeholder="address_Line_2" required>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="col form-group">
                                            <label for="first_name">City</label>
                                            <input class="form-control" name="city" type="text" placeholder="city">
                                        </div>
                                        <div class="col form-group">
                                            <label for="first_name">State</label>
                                            <input class="form-control" name="state" type="text" placeholder="state">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <label for="order_note">Order Notes</label>
                                        <textarea class="form-control" name="order_note" rows="2"></textarea>
                                    </div>
                                
                            </div>
                        </div>
                    </div> <!-- card.// -->

                </aside> <!-- col.// -->
                <aside class="col-lg-6">

                    <div class="card">
                        <div class="card-body">
                            <table class="table table-borderless table-shopping-cart">
                                <thead class="text-muted">
                                    <tr class="small text-uppercase">
                                        <th scope="col">Product</th>
                                        <th scope="col" width="120">Quantity</th>
                                        <th scope="col" width="120">Price</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    {% for cart_item in cart_items %}
                                    <tr>
                                        <td>
                                            <figure class="itemside align-items-center">
                                                <div class="aside"><img class="img-sm" src="{{ cart_item.product.image.url}}"></div>
                                                <figcaption class="info">
                                                    <a class="title text-dark" href="{{ cart_item.product.get_url }}">{{ cart_item.product.Product_name}}</a>
                                                    <p class="text-muted small">{{ cart_item.product.description }} <br>
                                                        Price: {{ cart_item.product.Price}}</p>
                                                </figcaption>
                                            </figure>
                                        </td>

                                        <td>
                                            <label for="">{{cart_item.quantity }}</label>
                                        </td>
                                        <td>
                                            <div class="price-wrap">
                                                <var class="price">${{ cart_item.sub_total}}</var>
                                                <small class="text-muted"> ${{ cart_item.product.Price}} </small>
                                            </div> <!-- price-wrap .// -->
                                        </td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                            <button class="btn btn-primary btn-block" type=" submit" href="{% url 'place_order' %}"> Place Order </button>
                            <a class="btn btn-light btn-block" href="{% url 'store' %}">Continue Shopping</a>
                        </div>
                    </div>
                </aside> <!-- col.// -->
                </form>
            </div> <!-- row.// -->
            <!-- ============================ COMPONENT 1 END .// ================================= -->
        </div> <!-- container .//  -->
    </section>

</body>
{% include 'footer.html' %}

</html>
