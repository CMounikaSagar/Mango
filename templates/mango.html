{% load static %}
<style>
        .floating-image {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            {% comment %} box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); {% endcomment %}
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .floating-image:hover {
            transform: scale(1.1);
        }
        .chat-label {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background-color: #ffcc00;
            color: #333;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
            font-weight: bold;
            z-index: 999;
        }
        .chat-message {
    margin: 5px;
    padding: 8px 12px;
    border-radius: 10px;
    max-width: 80%;
    clear: both;
}

.bot-message {
    background-color: #f1f1f1;
    float: left;
    text-align: left;
}

.user-message {
    background-color: #dcf8c6;
    float: right;
    text-align: right;
}


</style>
<!-- Chatbot Container -->
<div id="chat-container" style="position: fixed; bottom: 90px; right: 20px; width: 300px; background-color: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); padding: 10px; z-index: 1000; display: none;">
    <div class="text-end">
    <button  onclick="document.getElementById('chat-container').style.display='none';"><i class="bi bi-x-circle"></i></button> <!-- Close the chatbox when clicked on X-->
    </div>
    <!-- Chat Display Area -->
    <div id="chatbox" style="height: 250px; overflow-y: auto; padding: 5px; margin-bottom: 10px;">
        <!-- Messages will appear here -->
    </div>

    <!-- Input and Button -->
    <div style="display: flex;">
        <input type="text" id="userInput" class="form-control" placeholder="Type your question..." style="flex: 1;" />
        
        <button onclick="sendMessage()" class="btn btn-warning ms-2">Send</button>
    </div>
</div>

<!-- Floating Button -->
<img src="{% static 'images/mango1-removebg-preview.png' %}" alt="Chatbot" class="floating-image" onclick="toggleChat()" />

<!-- Chat Label -->
<div class="chat-label" id="chatLabel">Hello! How can I help you?</div>

    <script>
    function toggleChat() {
        const chatContainer = document.getElementById("chat-container");
        chatContainer.style.display = (chatContainer.style.display === "none" || chatContainer.style.display === "") ? "block" : "none";
    }

    function appendMessage(message, sender) {
        const chatbox = document.getElementById('chatbox');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('chat-message');
        msgDiv.classList.add(sender === 'bot' ? 'bot-message' : 'user-message');
        msgDiv.textContent = (sender === 'bot' ? 'Bot: ' : 'You: ') + message;
        chatbox.appendChild(msgDiv);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const message = input.value.trim();
        if (message === "") return;

        appendMessage(message, 'user');
        input.value = "";

        fetch("{% url 'chatbot_response' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            appendMessage(data.reply, 'bot');
        });
    }
</script>
