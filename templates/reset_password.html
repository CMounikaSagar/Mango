<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    
    @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

    *{

    font-family: "Merriweather", serif;
    font-optical-sizing: auto;
    font-weight: <weight>;
    font-style: normal;
    font-variation-settings:
        "wdth" 100;
    }
    body {
      background-image:linear-gradient(to right,rgba(255,113,0,0.4),rgba(255, 166, 0, 1));
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .forgot-container {
    /* for Safari */
    background-color:white;
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 540px;
    border: 1px solid rgba(255, 255, 255, 0.3); /* subtle border */
    }

    .forgot-form {
      flex: 1;
      padding: 20px 30px;
    }

    .form-icon {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #555;
    }

    .form-control {
      padding-left: 40px;
    }

    .error-msg {
      color: red;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .submit-btn {
      width: 100%;
      font-weight: 500;
    }

    
  </style>
</head>
<body>

  <div class=" card d-flex flex-row forgot-container">
    <!-- Left Image -->
    
    
    <!-- Right Form -->
    <div class="forgot-form">
      <h4 class="top-0 text-center"><strong>Reset Your Password</strong></h4>
      {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
        {% endif %}
      
      <form method="POST" action="{% url 'reset_password' %}">
        {% csrf_token %}
        <strong><label class="mt-5 mb-1">New Password:</label></strong>
        <div class="mb-3  position-relative">
          <input type="text" class="form-control border border-warning" placeholder="Phone Number" name="password" required>
        </div>
        <strong><label class="mb-1">Confirm Password:</label></strong>
        <div class="mb-3 position-relative"> 
          <input type="text" class="form-control border border-warning" placeholder="Phone Number" name="confirm_password" required>
        </div>
        <div class="align-items-center d-flex justify-content-center ">
        <!-- Submit Button -->
          <button type="submit" class="btn btn-warning submit-btn w-25">Submit</button>
        </div>
        <!-- Back to Login -->
        
      </form>
    </div>
  </div>

  <!-- Bootstrap Icons -->
</body>
</html>
