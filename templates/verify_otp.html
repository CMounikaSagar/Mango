<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tab-btn {
      width: 50%;
      border-radius: 10px 10px 0 0;
    }
    .input-group-text img {
      width: 24px;
      height: 16px;
    }
    .btn-orange {
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      color: white;
      border: none;
    }
    .btn-orange:hover {
      background: linear-gradient(90deg, #feb47b, #ff7e5f);
    }
    .separator {
      text-align: center;
      margin: 1rem 0;
      position: relative;
    }
    .separator::before, .separator::after {
      content: "";
      height: 1px;
      background: #ccc;
      position: absolute;
      top: 50%;
      width: 40%;
    }
    .separator::before {
      left: 0;
    }
    .separator::after {
      right: 0;
    }
  </style>
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="bg-white p-4 rounded shadow" style="max-width: 400px; width: 100%;">
    <h5 class="mb-1 fw-bold">Login Account</h5>
    <p class="text-muted small">Hello, welcome back to our account</p>

    
    
    <form method="POST">
  {% csrf_token %}
  <div class="form-group">
        <label for="phone" class="form-label">Phone Number:</label>
        <input type="text" id="phone" name="phone" class="form-control" placeholder="Enter phone number" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password:</label>
        <input type="password" id="password-input" name="password" class="form-control" placeholder="Password" />
      </div>

    <button type='submit' class="btn btn-orange w-100 mb-3 mt-2 rounded">Login</button>
</form>
    <p class="text-center small text-muted">Not Registered yet? 
      <a href="#" class="text-warning text-decoration-none fw-semibold">Create an Account</a>
    </p>
  </div>
</div>

</body>
</html>
