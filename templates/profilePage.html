<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/bcf6364679.js" crossorigin="anonymous"></script>

    <style>
        
		@import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

		*{

		font-family: "Merriweather", serif;
		font-optical-sizing: auto;
		font-weight: <weight>;
		font-style: normal;
		font-variation-settings:
			"wdth" 100;
		}
		.footer{
        background-image: linear-gradient(to bottom,rgba(255, 133, 0, 1), rgba(255, 166, 69, 0.7));
        
    	}

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-100 ">
    {% include 'nav.html' %}
    <section class="section-conten padding-y bg my-5">

<div class="container">
	<div class="row">
	{% include 'dashboard_aside.html' %}
	<main class="col-md-9">
		<article class="card">
		<header class="card-header">
			<h2 class="d-inline-block mr-3">Login as:{{ user.first_name }}</h2>
			
		</header>
		<div class="card-body">
			<div class="row"> 
				<div class="col md-6 ">
					<div class="card" >
						<div class="card-body">
							<h5 class="card-title">Total Orders</h5>
							<h4>{{ orders_count }}</h4>
							<a href="{% url 'myorders' %}" >View Orders</a>
						</div>
					</div>
				</div>
				<div class="col md-6 ">
					<div class="card" >
						<div class="card-body">
							<img src="{{ user_profile.profile_picture.url }}" class="w-25"/>
							<p>{{ user.email }}</p>
							<p>{{ user.phone_number }}</p>
						</div>
					</div>
				</div>
				
			</div> <!-- row.// -->
		</div> <!-- card-body .// -->
		
		</article> <!-- order-group.// --> 
	</main>
</div> <!-- row.// -->
</div>
</section> 
{% include 'footer.html' %}
</body>

</html>
